[project]
name = "l7-load-balancer"
version = "0.1.0"
description = "A production-grade Layer-7 HTTP load balancer built from scratch"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.1",
    "pydantic==2.9.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
