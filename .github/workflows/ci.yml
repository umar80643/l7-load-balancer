name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests with coverage
        run: |
          pytest --cov=lb --cov-report=term-missing --cov-report=xml tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build load balancer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: l7lb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build echo backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./demo/echobackend/Dockerfile
          push: false
          tags: l7lb-echobackend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for load balancer to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/admin/backends > /dev/null; then
              echo "load balancer is up"
              exit 0
            fi
            sleep 1
          done
          echo "load balancer never became ready"
          docker compose logs
          exit 1

      - name: Hit the proxy route and check for a 200
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "status: $status"
          test "$status" = "200"

      - name: Check /metrics is exposed
        run: curl -sf http://localhost:8080/metrics | grep -q lb_requests_total

      - name: Tear down
        if: always()
        run: docker compose down -v
